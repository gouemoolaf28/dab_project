# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 5f71b3ff-e7c9-4fd1-b790-69e22fbf8c98

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: your-workspace-url # replace with your Workspace URL
    presets:
      artifacts_dynamic_version: true

  test:
    mode: production
    presets:
      name_prefix: '[testing] '
    workspace:
      host: your-workspace-url # replace with your Workspace URL
      # We explicitly deploy to /Workspace/Users/olafgouemo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_test
    permissions:
      - service_principal_name: your-service-principal-name # update with your service principal name
        level: CAN_MANAGE
    run_as:
      service_principal_name: your-service-principal-name # update with your service principal name

  prod:
    mode: production
    workspace:
      host: your-workspace-url # replace with your Workspace URL
      # We explicitly deploy to /Workspace/Users/olafgouemo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: citibike_prod
    permissions:
      - service_principal_name: your-service-principal-name # update with your service principal name
        level: CAN_MANAGE
    run_as:
      service_principal_name: your-service-principal-name # update with your service principal name       
